<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Expense Tracker</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --muted:#6b7280; --accent:#06b6d4;
      --income:#10b981; --expense:#ef4444; --radius:10px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%);
      color:#0f172a; padding:24px; display:flex; align-items:flex-start; justify-content:center;
      min-height:100vh;
    }
    .app{width:100%;max-width:1000px;background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 8px 30px rgba(2,6,23,0.08);}
    header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    header h1{margin:0;font-size:1.25rem}
    .form-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .form-row input[type="text"], .form-row input[type="number"], .form-row input[type="date"], .form-row select {
      padding:10px;border-radius:8px;border:1px solid #e6e9ef;font-size:1rem;
    }
    .form-row .btn {background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;}
    .summary{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
    .card{background:#fff;padding:10px 14px;border-radius:8px;border:1px solid rgba(2,6,23,0.04);min-width:140px}
    .card .label{font-size:.82rem;color:var(--muted)}
    .card .value{font-weight:700;font-size:1.1rem;margin-top:6px}
    .controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
    .controls select, .controls button{padding:8px;border-radius:8px;border:1px solid #e6e9ef;background:transparent}
    .controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px;border-bottom:1px solid #f0f2f6;text-align:left}
    .amount.income{color:var(--income);font-weight:700}
    .amount.expense{color:var(--expense);font-weight:700}
    .actions button{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px}
    .edit-input{padding:6px;border-radius:6px;border:1px solid #dfe6ff}
    .empty{padding:18px;text-align:center;color:var(--muted)}
    @media (max-width:760px){
      .form-row{flex-direction:column}
      .summary{flex-direction:column;align-items:flex-start}
      th:nth-child(4), td:nth-child(4){display:none}
    }
  </style>
</head>
<body>
  <main class="app" id="app" aria-live="polite">
    <header>
      <h1>Expense Tracker</h1>
    </header>

    <form id="entryForm" class="form-row" onsubmit="return false;" aria-label="Add transaction">
      <input id="type" required aria-label="Type" title="Type" style="min-width:120px" list="types" />
      <datalist id="types"><option>Expense</option><option>Income</option></datalist>

      <input id="amount" type="number" step="0.01" placeholder="Amount" required aria-label="Amount" style="width:140px"/>

      <select id="category" aria-label="Category" required>
        <option value="">Category</option>
        <option>Food</option><option>Travel</option><option>Rent</option><option>Shopping</option><option>Salary</option><option>Other</option>
      </select>

      <input id="description" type="text" placeholder="Description (optional)" aria-label="Description" style="flex:1;min-width:160px"/>

      <input id="date" type="date" aria-label="Date" style="width:160px"/>

      <button id="addBtn" class="btn" aria-label="Add transaction">Add</button>
    </form>

    <div class="summary" role="region" aria-label="Summary">
      <div class="card">
        <div class="label">Total Income</div>
        <div id="totalIncome" class="value">0</div>
      </div>
      <div class="card">
        <div class="label">Total Expense</div>
        <div id="totalExpense" class="value">0</div>
      </div>
      <div class="card">
        <div class="label">Balance</div>
        <div id="balance" class="value">0</div>
      </div>
    </div>

    <div class="controls" role="toolbar" aria-label="Filters">
      <select id="filterCategory" aria-label="Filter by category">
        <option value="all">All Categories</option>
        <option>Food</option><option>Travel</option><option>Rent</option><option>Shopping</option><option>Salary</option><option>Other</option>
      </select>

      <div aria-hidden="true" style="width:8px"></div>

      <button class="filterType active" data-type="all">All</button>
      <button class="filterType" data-type="income">Income</button>
      <button class="filterType" data-type="expense">Expense</button>

      <button id="clearAll" style="margin-left:auto;background:#f3f4f6;border:0;padding:8px;border-radius:8px;cursor:pointer">Clear All</button>
    </div>

    <table role="table" aria-label="Transactions">
      <thead>
        <tr><th>Date</th><th>Description</th><th>Category</th><th>Note</th><th style="text-align:right">Amount</th><th>Actions</th></tr>
      </thead>
      <tbody id="txBody">
      </tbody>
    </table>

    <div id="empty" class="empty" hidden>No transactions yet.</div>
  </main>

  <script>
    (function(){
      const STORAGE_KEY = 'expenses-v1';
      let tx = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const txBody = document.getElementById('txBody');
      const totalIncomeEl = document.getElementById('totalIncome');
      const totalExpenseEl = document.getElementById('totalExpense');
      const balanceEl = document.getElementById('balance');
      const form = document.getElementById('entryForm');
      const typeInput = document.getElementById('type');
      const amountInput = document.getElementById('amount');
      const categoryInput = document.getElementById('category');
      const descInput = document.getElementById('description');
      const dateInput = document.getElementById('date');
      const filterCategory = document.getElementById('filterCategory');
      const filterTypeBtns = document.querySelectorAll('.filterType');
      const clearAllBtn = document.getElementById('clearAll');
      const emptyMsg = document.getElementById('empty');

   
      dateInput.valueAsDate = new Date();

      function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tx)); }
      function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

      function formatAmount(v){ return Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
      function formatDate(d){ const dt = new Date(d); if(isNaN(dt)) return ''; return dt.toLocaleDateString(); }

      function render(){
        const catFilter = filterCategory.value;
        const activeType = document.querySelector('.filterType.active').dataset.type;
        const visible = tx.filter(t => (catFilter === 'all' || t.category === catFilter) && (activeType === 'all' || t.type === activeType));

        txBody.innerHTML = '';
        if(visible.length === 0){
          emptyMsg.hidden = false;
        } else {
          emptyMsg.hidden = true;
          visible.forEach(t => {
            const tr = document.createElement('tr');
            tr.dataset.id = t.id;
            tr.innerHTML = `
              <td>${formatDate(t.date)}</td>
              <td class="desc">${escapeHtml(t.description)}</td>
              <td>${escapeHtml(t.category)}</td>
              <td style="color:var(--muted);font-size:.9rem">${escapeHtml(t.note||'')}</td>
              <td style="text-align:right"><span class="amount ${t.type==='Income' ? 'income' : 'expense'}">${t.type==='Income' ? '+' : '-'}${formatAmount(t.amount)}</span></td>
              <td class="actions">
                <button data-action="edit" aria-label="Edit">Edit</button>
                <button data-action="delete" aria-label="Delete">Delete</button>
              </td>
            `;
            txBody.appendChild(tr);
          });
        }

        const totalIncome = tx.filter(t=>t.type==='Income').reduce((s,n)=>s+Number(n.amount),0);
        const totalExpense = tx.filter(t=>t.type==='Expense').reduce((s,n)=>s+Number(n.amount),0);
        totalIncomeEl.textContent = formatAmount(totalIncome);
        totalExpenseEl.textContent = formatAmount(totalExpense);
        balanceEl.textContent = formatAmount(totalIncome - totalExpense);
      }

      function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

     
      document.getElementById('addBtn').addEventListener('click', () => {
        const type = (typeInput.value || '').trim() || 'Expense';
        const amount = parseFloat(amountInput.value);
        const category = (categoryInput.value || '').trim();
        if(isNaN(amount) || amount <= 0){ alert('Enter a positive amount'); amountInput.focus(); return; }
        if(!category){ alert('Choose a category'); categoryInput.focus(); return; }
        const description = descInput.value.trim();
        const date = dateInput.value || new Date().toISOString();
        const id = uid();
        tx.unshift({ id, type: capitalize(type), amount: Math.abs(amount), category, description, date, note:'' });
        save(); render();
        amountInput.value=''; descInput.value=''; categoryInput.value=''; typeInput.value=''; dateInput.valueAsDate = new Date();
      });

      
      txBody.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if(!btn) return;
        const tr = btn.closest('tr');
        const id = tr.dataset.id;
        const idx = tx.findIndex(t => t.id === id);
        if(idx === -1) return;

        if(btn.dataset.action === 'delete'){
          if(confirm('Delete this transaction?')) {
            tx.splice(idx,1); save(); render();
          }
        }

        if(btn.dataset.action === 'edit'){
          
          const item = tx[idx];
          tr.innerHTML = `
            <td><input class="edit-input" type="date" value="${item.date.slice(0,10)}"></td>
            <td><input class="edit-input" type="text" value="${escapeAttr(item.description)}"></td>
            <td>
              <select class="edit-input">
                <option${item.category==='Food'?' selected':''}>Food</option>
                <option${item.category==='Travel'?' selected':''}>Travel</option>
                <option${item.category==='Rent'?' selected':''}>Rent</option>
                <option${item.category==='Shopping'?' selected':''}>Shopping</option>
                <option${item.category==='Salary'?' selected':''}>Salary</option>
                <option${item.category==='Other'?' selected':''}>Other</option>
              </select>
            </td>
            <td><input class="edit-input" type="text" value="${escapeAttr(item.note||'')}"></td>
            <td style="text-align:right">
              <input class="edit-input" type="number" step="0.01" value="${item.amount}" style="width:120px">
              <div style="margin-top:6px">
                <select class="edit-input" style="width:120px">
                  <option${item.type==='Income'?' selected':''}>Income</option>
                  <option${item.type==='Expense'?' selected':''}>Expense</option>
                </select>
              </div>
            </td>
            <td class="actions">
              <button data-action="save">Save</button>
              <button data-action="cancel">Cancel</button>
            </td>
          `;
        }

        if(btn.dataset.action === 'save'){
          
          const inputs = tr.querySelectorAll('.edit-input');
          const [dDate, dDesc, dCategory, dNote, dAmount, dType] = inputs;
          const newDate = dDate.value || item.date;
          const newDesc = dDesc.value.trim();
          const newCategory = dCategory.value;
          const newNote = dNote.value.trim();
          const newAmount = parseFloat(dAmount.value);
          const newTypeVal = dType.value;
          if(isNaN(newAmount) || newAmount <= 0){ alert('Enter positive amount'); return; }
          tx[idx].date = newDate;
          tx[idx].description = newDesc;
          tx[idx].category = newCategory;
          tx[idx].note = newNote;
          tx[idx].amount = Math.abs(newAmount);
          tx[idx].type = capitalize(newTypeVal);
          save(); render();
        }

        if(btn.dataset.action === 'cancel'){
          render();
        }
      });


      filterCategory.addEventListener('change', () => render());
      filterTypeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterTypeBtns.forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          render();
        });
      });

      clearAllBtn.addEventListener('click', () => {
        if(confirm('Clear all transactions? This cannot be undone.')){ tx = []; save(); render(); }
      });

      function capitalize(s){ return (s||'').toString().replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase()); }
      function escapeAttr(s){ return (s||'').toString().replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

      render();
    })();
  </script>
</body>
</html>
