<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/expense-tracker/style.css" />
</head>
<body>
  <main class="app" id="app" aria-live="polite">
    <header>
      <h1>Expense Tracker</h1>
    </header>

    <form id="entryForm" class="form-row" onsubmit="return false;" aria-label="Add transaction">
      <input id="type" required aria-label="Type" title="Type" style="min-width:120px" list="types" />
      <datalist id="types"><option>Expense</option><option>Income</option></datalist>

      <input id="amount" type="number" step="0.01" placeholder="Amount" required aria-label="Amount" style="width:140px"/>

      <select id="category" aria-label="Category" required>
        <option value="">Category</option>
        <option>Food</option><option>Travel</option><option>Rent</option><option>Shopping</option><option>Salary</option><option>Other</option>
      </select>

      <input id="description" type="text" placeholder="Description (optional)" aria-label="Description" style="flex:1;min-width:160px"/>

      <input id="date" type="date" aria-label="Date" style="width:160px"/>

      <button id="addBtn" class="btn" aria-label="Add transaction">Add</button>
    </form>

    <div class="summary" role="region" aria-label="Summary">
      <div class="card">
        <div class="label">Total Income</div>
        <div id="totalIncome" class="value">0</div>
      </div>
      <div class="card">
        <div class="label">Total Expense</div>
        <div id="totalExpense" class="value">0</div>
      </div>
      <div class="card">
        <div class="label">Balance</div>
        <div id="balance" class="value">0</div>
      </div>
    </div>

    <div class="controls" role="toolbar" aria-label="Filters">
      <select id="filterCategory" aria-label="Filter by category">
        <option value="all">All Categories</option>
        <option>Food</option><option>Travel</option><option>Rent</option><option>Shopping</option><option>Salary</option><option>Other</option>
      </select>

      <div aria-hidden="true" style="width:8px"></div>

      <button class="filterType active" data-type="all">All</button>
      <button class="filterType" data-type="income">Income</button>
      <button class="filterType" data-type="expense">Expense</button>

      <button id="clearAll" style="margin-left:auto;background:#f3f4f6;border:0;padding:8px;border-radius:8px;cursor:pointer">Clear All</button>
    </div>

    <table role="table" aria-label="Transactions">
      <thead>
        <tr><th>Date</th><th>Description</th><th>Category</th><th>Note</th><th style="text-align:right">Amount</th><th>Actions</th></tr>
      </thead>
      <tbody id="txBody">
      </tbody>
    </table>

    <div id="empty" class="empty" hidden>No transactions yet.</div>
  </main>

  <script src="/expense-tracker/script.js"></script>
</body>
</html>
